name: CI

# Run manually from the GitHub Actions tab while CI is being validated.
on:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forgejo_mcp_test
          POSTGRES_USER: forgejo_mcp
          POSTGRES_PASSWORD: integration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgejo_mcp -d forgejo_mcp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FMCP_DATABASE_URL: postgresql+asyncpg://forgejo_mcp:integration-test-password@127.0.0.1:5432/forgejo_mcp_test
      FMCP_TEST_DATABASE_URL: postgresql+asyncpg://forgejo_mcp:integration-test-password@127.0.0.1:5432/forgejo_mcp_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run typecheck --prefix frontend
      - run: npm run build --prefix frontend
